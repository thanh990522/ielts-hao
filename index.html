<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Hào · Foundation 1</title>
<meta name="description" content="IELTS Foundation 1 interactive course · Teacher Hà Chí Thanh · Aim 6.0+">
<style>
:root {
  --navy:#183153; --teal:#18a6a6; --teal2:#dff8f6; --sky:#e9f6ff;
  --yellow:#ffd86b; --peach:#ffad8f; --pink:#ffd9e8; --purple:#8d7cf5;
  --green:#75c98a; --ink:#243447; --muted:#6c7b8a; --paper:#fffefa;
  --line:#dce8ef; --shadow:0 12px 30px rgba(34,72,98,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;color:var(--ink);
  background:
  radial-gradient(circle at 8% 8%,rgba(255,216,107,.28) 0 90px,transparent 91px),
  radial-gradient(circle at 94% 18%,rgba(141,124,245,.12) 0 120px,transparent 121px),
  #f5fbff;
  line-height:1.65}
button,input,textarea{font:inherit}
a{color:#087b92;font-weight:700;text-decoration:none}
a:hover{text-decoration:underline}
.app{min-height:100vh}
.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,#153653,#1f6685 55%,#1ba3a4);color:white;padding:28px 32px 24px}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.11)}
.hero:before{width:180px;height:180px;right:8%;top:-70px}
.hero:after{width:90px;height:90px;right:24%;bottom:-45px}
.hero-inner{max-width:1380px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:24px;position:relative;z-index:1}
.brand{display:flex;gap:18px;align-items:center}
.mascot{width:74px;height:74px;border-radius:26px;background:#fff7d8;color:#17334f;display:grid;place-items:center;font-size:40px;box-shadow:0 8px 0 rgba(0,0,0,.08);transform:rotate(-4deg)}
.eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;font-weight:900;opacity:.8}
.hero h1{margin:3px 0 4px;font-size:clamp(28px,4vw,45px);line-height:1.05}
.hero p{margin:0;opacity:.92}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:8px 12px;border-radius:999px;font-weight:800;font-size:13px}
.shell{max-width:1420px;margin:0 auto;padding:22px;display:grid;grid-template-columns:280px 1fr;gap:22px}
.sidebar{position:sticky;top:16px;align-self:start;background:white;border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:var(--shadow)}
.progress-card{background:linear-gradient(145deg,#fff7cf,#fff);border:1px solid #f5df90;border-radius:18px;padding:14px;margin-bottom:14px}
.progress-title{display:flex;justify-content:space-between;font-size:13px;font-weight:900}
.progress-track{height:10px;background:#e8edf1;border-radius:99px;margin-top:8px;overflow:hidden}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#30b4a6,#79c56c);transition:.3s}
.lesson-nav{display:grid;gap:9px}
.lesson-btn{border:0;background:#f6fafc;color:var(--ink);text-align:left;border-radius:16px;padding:12px;cursor:pointer;display:grid;grid-template-columns:42px 1fr;gap:10px;align-items:center;border:1px solid transparent;transition:.2s}
.lesson-btn:hover{transform:translateY(-1px);background:#eef8fb}
.lesson-btn.active{background:#e5f8f6;border-color:#96dcd7;box-shadow:0 5px 14px rgba(24,166,166,.12)}
.lesson-num{width:40px;height:40px;border-radius:14px;background:white;display:grid;place-items:center;font-size:22px;box-shadow:0 3px 8px rgba(0,0,0,.06)}
.lesson-btn b{display:block;font-size:14px}
.lesson-btn small{display:block;color:var(--muted);font-size:11px;line-height:1.3;margin-top:2px}
.main{min-width:0}
.lesson-head{background:white;border:1px solid var(--line);border-radius:26px;padding:22px 24px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.lesson-head:after{content:"★";position:absolute;right:24px;top:12px;font-size:50px;color:rgba(255,216,107,.45);transform:rotate(18deg)}
.lesson-kicker{color:var(--teal);font-weight:900;text-transform:uppercase;font-size:12px;letter-spacing:2px}
.lesson-head h2{margin:3px 0 5px;color:var(--navy);font-size:31px}
.lesson-sub{color:var(--muted);font-size:13px;font-weight:800}
.outcome{margin-top:14px;padding:12px 14px;background:#f0f8ff;border-left:5px solid var(--teal);border-radius:12px;font-weight:700}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.tab-btn{border:1px solid var(--line);background:white;color:var(--ink);padding:10px 15px;border-radius:14px;font-weight:900;cursor:pointer;box-shadow:0 4px 10px rgba(20,50,70,.05)}
.tab-btn.active{background:var(--navy);color:white;border-color:var(--navy)}
.panel{display:none}
.panel.active{display:block}
.theory-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.theory-card{background:white;border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:0 6px 16px rgba(31,64,86,.06);position:relative;overflow:hidden}
.theory-card:before{content:"";position:absolute;width:9px;height:100%;left:0;top:0;background:var(--teal)}
.theory-card h3{margin:0 0 6px;color:var(--navy);font-size:17px}
.theory-card p{margin:0;color:#455969}
.visual-board{margin-top:15px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.visual-step{text-align:center;border:1px dashed #9acdc9;background:#f7fffe;border-radius:14px;padding:9px;font-size:12px;font-weight:900}
.visual-step .big{font-size:26px;display:block}
.task-list{display:grid;gap:14px}
.task-card{background:white;border:1px solid var(--line);border-radius:21px;padding:18px;box-shadow:0 6px 18px rgba(20,56,80,.07)}
.task-card.done{border-color:#88d39b;background:#fbfffb}
.task-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.task-title{margin:0;color:var(--navy);font-size:17px;line-height:1.35}
.done-toggle{border:0;background:#eef5f7;border-radius:999px;padding:7px 10px;cursor:pointer;font-size:12px;font-weight:900;white-space:nowrap}
.done-toggle.on{background:#ddf5e1;color:#25753b}
.task-body{margin-top:12px}
.task-body p{margin:8px 0}
.qline{background:#f8fbfd;border-left:3px solid #b7dce3;padding:7px 10px;border-radius:7px}
.source-note{font-size:12px;color:var(--muted);background:#faf7ed;padding:7px 10px;border-radius:8px}
.inline-blank{min-width:110px;max-width:220px;border:0;border-bottom:2px solid #8eabb8;background:#fffdf2;padding:3px 6px;outline:none}
.inline-blank:focus{border-color:var(--teal)}
.table-wrap{overflow-x:auto;margin:10px 0}
.worksheet-table{border-collapse:separate;border-spacing:0;width:100%;min-width:420px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.worksheet-table td,.worksheet-table th{padding:8px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.worksheet-table tr:last-child td{border-bottom:0}
.worksheet-table td:last-child,.worksheet-table th:last-child{border-right:0}
.worksheet-table tr:nth-child(even) td{background:#f9fcfd}
.answer-btn{margin-top:12px;border:0;border-radius:12px;padding:9px 13px;background:#fff0b8;color:#6e5410;font-weight:900;cursor:pointer}
.answer-btn:hover{background:#ffe48d}
.answer-box{display:none;margin-top:10px;background:linear-gradient(145deg,#f0fff6,#fbfffd);border:1px solid #b7e4c4;border-radius:15px;padding:13px 15px}
.answer-box.show{display:block}
.answer-box:before{content:"✅ Answer & explanation";display:block;font-weight:900;color:#26773d;margin-bottom:5px}
.answer-box ol{margin:5px 0;padding-left:22px}
.answer-box p{margin:6px 0}
.student-note{width:100%;min-height:68px;margin-top:10px;border:1px solid #cbdce4;border-radius:12px;padding:9px 11px;resize:vertical;background:#fff}
.extra-note{background:#f7f1ff;border:1px solid #d8ccff;border-radius:16px;padding:13px;margin-bottom:14px}
.hw-list{display:grid;gap:10px}
.hw-item{display:flex;gap:12px;align-items:flex-start;background:white;border:1px solid var(--line);border-radius:15px;padding:13px}
.hw-item input{width:20px;height:20px;accent-color:var(--teal);margin-top:3px}
.empty{padding:20px;text-align:center;color:var(--muted)}
.footer{max-width:1420px;margin:0 auto;padding:4px 22px 28px;color:var(--muted);font-size:12px;text-align:center}
.spark{display:inline-block;animation:bob 2.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{position:static}.lesson-nav{grid-template-columns:repeat(2,1fr)}.theory-grid{grid-template-columns:1fr}.hero-inner{align-items:flex-start;flex-direction:column}.chips{justify-content:flex-start}}
@media(max-width:520px){.shell{padding:12px}.lesson-nav{grid-template-columns:1fr}.hero{padding:22px 16px}.visual-board{grid-template-columns:repeat(2,1fr)}.task-top{flex-direction:column}}
</style>
</head>
<body>
<div class="app">
<header class="hero">
  <div class="hero-inner">
    <div class="brand">
      <div class="mascot spark">🦉</div>
      <div>
        <div class="eyebrow">IELTS HÀO · FOUNDATION 1</div>
        <h1>IELTS 4.0 → <span style="color:#ffe88c">6.0+</span></h1>
        <p>Cute, focused, interactive learning space</p>
      </div>
    </div>
    <div class="chips">
      <span class="chip">👨‍🏫 Teacher: Hà Chí Thanh</span>
      <span class="chip">🎯 Aim: 6.0+</span>
      <span class="chip">⏱ 90 min / Lesson</span>
      <span class="chip">📚 6 Lessons</span>
    </div>
  </div>
</header>

<div class="shell">
  <aside class="sidebar">
    <div class="progress-card">
      <div class="progress-title"><span>Course progress</span><span id="progressText">0%</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="lesson-nav" id="lessonNav"></div>
  </aside>

  <main class="main">
    <section class="lesson-head" id="lessonHead"></section>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="theory">📖 Theory</button>
      <button class="tab-btn" data-tab="practice">✍️ Practice</button>
      <button class="tab-btn" data-tab="extra">✨ Extra Practice</button>
      <button class="tab-btn" data-tab="homework">🏠 Homework</button>
    </nav>
    <section class="panel active" id="panel-theory"></section>
    <section class="panel" id="panel-practice"></section>
    <section class="panel" id="panel-extra"></section>
    <section class="panel" id="panel-homework"></section>
  </main>
</div>
<footer class="footer">Foundation 1 materials are organised from the six uploaded worksheets. Progress is saved locally in this browser. 🌈</footer>
</div>

<script type="application/json" id="lesson-data">[{"id": 1, "title": "Baseline & Study System", "subtitle": "Worksheet Sessions 1 · Lessons 1 & 2", "emoji": "🌱", "outcome": "Diagnose your starting level across all four skills, build a repeatable study routine, and produce a controlled Present Simple paragraph.", "theory": [["Study loop", "LEARN → NOTE → USE → REVIEW → RETEST. Study actively for 30–45 minutes and revisit new language within 24 hours."], ["Present Simple", "Use it for routines, facts and frequency. I/you/we/they work; he/she/it works. Negatives use don’t/doesn’t; questions use Do/Does."], ["Word families", "Learn a word together with its part of speech and related forms, e.g. advice (n) → advise (v)."], ["Listening prediction", "Before listening, predict whether a blank needs a name, number, time, place or code."], ["Reading evidence", "Scan for names, numbers and key words; choose an answer only when the text provides evidence."], ["Quantity & frequency", "Use no/few/some/a lot of/all and frequency expressions to describe habits and survey data."]], "tasks": [{"id": "l1-t1", "title": "Task A ·  Complete the sentences with the correct Present Simple form.", "mode": "main", "body": "<p class=\"qline\">1.\tJulia  <input class=\"inline-blank\" aria-label=\"answer blank\">  (not / drink) tea very often.</p><p class=\"qline\">2.\tWhat time  <input class=\"inline-blank\" aria-label=\"answer blank\">  (the banks / close) here?</p><p class=\"qline\">3.\tI have a car, but I  <input class=\"inline-blank\" aria-label=\"answer blank\">  (not / use) it much.</p><p class=\"qline\">4.\tWhere  <input class=\"inline-blank\" aria-label=\"answer blank\">  (Maria / come) from? Is she Spanish?</p><p class=\"qline\">5.\t“What  <input class=\"inline-blank\" aria-label=\"answer blank\">  (you / do)?”  “I’m an electrician.”</p><p class=\"qline\">6.\tLook at this sentence. What  <input class=\"inline-blank\" aria-label=\"answer blank\">  (this word / mean)?</p><p class=\"qline\">7.\tDavid isn’t very fit. He  <input class=\"inline-blank\" aria-label=\"answer blank\">  (not / do) any sport.</p><p class=\"qline\">8.\tIt  <input class=\"inline-blank\" aria-label=\"answer blank\">  (take) me an hour to get to work. How long  <input class=\"inline-blank\" aria-label=\"answer blank\">  (it / take) you?</p><p class=\"source-note\">📚 Source  English Grammar in Use, 5th Ed., Unit 2 “Present simple (I do)”, pp. 4–5.</p>", "answer": "<ol><li>doesn’t drink</li><li>do the banks close</li><li>don’t use</li><li>does Maria come</li><li>do you do</li><li>does this word mean</li><li>doesn’t do</li><li>takes; does it take</li></ol><p><b>Rule:</b> with he/she/it, use <i>does/doesn’t + base verb</i>; the main verb does not take -s after does.</p>"}], "homework": ["Rewrite the diagnostic paragraph after feedback.", "Review 8–12 routine expressions the next day for 10 minutes.", "Add every recurring grammar error to your Error Log.", "Complete both online listening tasks in the Extension sections."]}]</script>
<!-- Full interactive dataset for all 6 lessons is injected below at runtime by the generated app payload. -->
<script>
// Compact loader replaces the bootstrap payload above with the complete generated data object.
const FULL_DATA_B64 = "";
function safeGet(k){ try { return localStorage.getItem(k); } catch(e) { return null; } }
function safeSet(k,v){ try { localStorage.setItem(k,v); } catch(e) {} }
let LESSONS = JSON.parse(document.getElementById('lesson-data').textContent);
let currentLesson = Number(safeGet('ieltsHaoLesson') || 1);
const nav = document.getElementById('lessonNav');
const head = document.getElementById('lessonHead');
const panels = { theory:document.getElementById('panel-theory'), practice:document.getElementById('panel-practice'), extra:document.getElementById('panel-extra'), homework:document.getElementById('panel-homework') };
function storageKey(id){return 'ieltsHaoDone:'+id}
function isDone(id){return safeGet(storageKey(id))==='1'}
function setDone(id,v){safeSet(storageKey(id),v?'1':'0');updateProgress()}
function renderNav(){ nav.innerHTML=LESSONS.map(l=>`<button class="lesson-btn ${l.id===currentLesson?'active':''}" data-lesson="${l.id}"><span class="lesson-num">${l.emoji}</span><span><b>Lesson ${l.id} · ${l.title}</b><small>${l.subtitle}</small></span></button>`).join(''); nav.querySelectorAll('.lesson-btn').forEach(b=>b.onclick=()=>{currentLesson=Number(b.dataset.lesson);safeSet('ieltsHaoLesson',currentLesson);renderAll();window.scrollTo({top:0,behavior:'smooth'})}) }
function visualFor(l){ const sets={1:[['🧠','LEARN'],['📝','NOTE'],['💬','USE'],['🔁','REVIEW'],['✅','RETEST']],2:[['👨‍👩‍👧','FAMILY'],['👅','/ð/'],['🎤','SPEAK'],['🔢','LISTEN'],['🔎','SCAN']],3:[['🌅','ROUTINE'],['⏱','TENSE'],['🔗','LINK'],['🔊','STRESS'],['🎙','SPEAK']],4:[['👶','STAGES'],['📖','STORY'],['🕰','PAST'],['➡️','SEQUENCE'],['✍️','WRITE']],5:[['🎈','OCCASION'],['🔗','CONNECT'],['🗣','-ED'],['🎤','PART 2'],['🧪','CHECK']],6:[['🛠','EDIT'],['📊','DATA'],['✍️','WRITE'],['🧠','RETRIEVE'],['🚀','SPEAK']]}; return `<div class="visual-board">${sets[l.id].map(x=>`<div class="visual-step"><span class="big">${x[0]}</span>${x[1]}</div>`).join('')}</div>` }
function renderTheory(l){ panels.theory.innerHTML=`<div class="theory-grid">${l.theory.map((x,i)=>`<article class="theory-card"><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join('')}</div>${visualFor(l)}<div class="extra-note" style="margin-top:15px"><b>💡 How to use this tab:</b> Review theory first, then move to Practice. Answer before opening the inline key.</div>` }
function renderTasks(l,mode){ const items=l.tasks.filter(t=>t.mode===mode); const dest=mode==='main'?panels.practice:panels.extra; dest.innerHTML=(mode==='extra'?'<div class="extra-note"><b>✨ Extra Practice</b><br>Complete these after the core practice.</div>':'')+`<div class="task-list">${items.map(t=>`<article class="task-card ${isDone(t.id)?'done':''}" data-task="${t.id}"><div class="task-top"><h3 class="task-title">${t.title}</h3><button class="done-toggle ${isDone(t.id)?'on':''}" data-done="${t.id}">${isDone(t.id)?'✓ Done':'Mark done'}</button></div><div class="task-body">${t.body||'<p>Complete the task as instructed in the worksheet.</p>'}</div><textarea class="student-note" placeholder="My answer / notes…"></textarea><button class="answer-btn" aria-expanded="false">💡 Show answer</button><div class="answer-box">${t.answer}</div></article>`).join('')}</div>`; dest.querySelectorAll('.answer-btn').forEach(btn=>btn.onclick=()=>{const box=btn.nextElementSibling;const open=box.classList.toggle('show');btn.textContent=open?'🙈 Hide answer':'💡 Show answer';btn.setAttribute('aria-expanded',open)}); dest.querySelectorAll('[data-done]').forEach(btn=>btn.onclick=()=>{const id=btn.dataset.done;setDone(id,!isDone(id));renderTasks(l,mode)}) }
function renderHomework(l){ panels.homework.innerHTML=`<div class="hw-list">${l.homework.map((h,i)=>{const id=`hw-${l.id}-${i}`;const checked=isDone(id);return `<label class="hw-item"><input type="checkbox" data-hw="${id}" ${checked?'checked':''}><span>${h}</span></label>`}).join('')}</div>`; panels.homework.querySelectorAll('[data-hw]').forEach(x=>x.onchange=()=>setDone(x.dataset.hw,x.checked)) }
function renderHead(l){ head.innerHTML=`<div class="lesson-kicker">Lesson ${l.id} · Foundation 1</div><h2>${l.emoji} ${l.title}</h2><div class="lesson-sub">${l.subtitle} · 90 MIN · Target ≥ 70%</div><div class="outcome">🎯 <b>Today’s outcome:</b> ${l.outcome}</div>` }
function updateProgress(){ const taskIds=LESSONS.flatMap(l=>l.tasks.map(t=>t.id));const hwIds=LESSONS.flatMap(l=>l.homework.map((_,i)=>`hw-${l.id}-${i}`));const ids=taskIds.concat(hwIds);const done=ids.filter(isDone).length;const pct=ids.length?Math.round(done/ids.length*100):0;document.getElementById('progressText').textContent=pct+'%';document.getElementById('progressFill').style.width=pct+'%' }
function renderAll(){ const l=LESSONS.find(x=>x.id===currentLesson)||LESSONS[0];renderNav();renderHead(l);renderTheory(l);renderTasks(l,'main');renderTasks(l,'extra');renderHomework(l);updateProgress() }
document.querySelectorAll('.tab-btn').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b===btn));Object.entries(panels).forEach(([k,p])=>p.classList.toggle('active',k===btn.dataset.tab))}); renderAll();
</script>
</body>
</html>
