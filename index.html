<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IELTS Hào · Foundation 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--teal:#0ea5a5;--teald:#08736f;--teall:#b9eae6;--blue:#1d5fa8;--blued:#123e70;--bluel:#d7e8fa;--yellow:#ffc833;--yellowd:#e9a200;--yellowl:#fff1c9;--sky:#eaf7f8;--paper:#fff;--ink:#0f2e3d;--muted:#5b7887;--ok:#1b9e63;--no:#d64545;--r:18px;--sh:0 6px 0 rgba(15,46,61,.08);--sh2:0 12px 30px rgba(15,46,61,.12)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:var(--ink);line-height:1.55;background:radial-gradient(circle at 12% 9%,#fff6d9 0 14%,transparent 15%),radial-gradient(circle at 88% 20%,#dff3f5 0 14%,transparent 15%),linear-gradient(180deg,#f4fbfc,#fff 60%,#f2fafb);background-attachment:fixed}button,input,textarea,select{font:inherit}h1,h2,h3,h4{font-family:'Baloo 2','Nunito',sans-serif;line-height:1.18}.wrap{max-width:1180px;margin:auto;padding:0 16px}.banner{color:#fff;background:linear-gradient(115deg,var(--blued),var(--blue) 40%,var(--teal));padding:16px 0;box-shadow:var(--sh2);position:relative;overflow:hidden}.banner:after{content:'✦';position:absolute;right:5%;top:-30px;font-size:140px;color:rgba(255,255,255,.08)}.banner .wrap{display:flex;align-items:center;gap:15px;position:relative}.mascot{width:74px;height:74px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:45px;box-shadow:0 4px 0 rgba(0,0,0,.15)}.brand{flex:1}.brand h1{margin:0;font-size:clamp(22px,3.5vw,34px)}.brand p{margin:1px 0 0;color:#d7f7f5;font-weight:700;letter-spacing:1.2px;font-size:12px}.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.38);padding:7px 12px;border-radius:999px;font-size:12px;font-weight:800}.pill strong{color:var(--yellow)}
.lessonbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.95);backdrop-filter:blur(9px);border-bottom:3px solid var(--teall);box-shadow:0 4px 14px rgba(15,46,61,.06)}#lessonNav{display:flex;gap:8px;overflow-x:auto;padding:9px 0}.lesson-tab{flex:0 0 auto;display:flex;gap:9px;align-items:center;border:2px solid transparent;background:var(--sky);color:var(--blued);padding:8px 12px;border-radius:15px;cursor:pointer;text-align:left}.lesson-tab:hover{background:var(--teall)}.lesson-tab.on{background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;box-shadow:0 4px 0 var(--blued)}.lnum{width:27px;height:27px;border-radius:9px;background:#fff;color:var(--blue);display:grid;place-items:center;font-family:'Baloo 2';font-weight:800}.lesson-tab.on .lnum{background:var(--yellow);color:#5a3b00}.lesson-tab b{display:block;font-size:12px;white-space:nowrap}.lesson-tab small{display:block;font-size:9.5px;opacity:.8}
.hero{margin:18px 0 12px;background:#fff;border:2px solid var(--sky);border-radius:22px;padding:16px 18px;box-shadow:var(--sh);display:flex;gap:14px;align-items:center}.heroicon{width:56px;height:56px;border-radius:17px;background:var(--yellowl);display:grid;place-items:center;font-size:31px}.hero h2{margin:0;color:var(--blued);font-size:25px}.hero p{margin:2px 0;color:var(--muted);font-size:13px}.progress{margin-left:auto;width:150px}.progressline{height:9px;background:var(--sky);border-radius:999px;overflow:hidden}.progressline i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yellow),var(--teal));transition:.25s}.progress label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:800;margin-bottom:5px}
.tabbar{display:flex;gap:8px;overflow:auto;padding:6px 0 10px}.tab{border:2px solid transparent;background:var(--sky);color:var(--blued);font-family:'Baloo 2';font-weight:800;font-size:14px;padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}.tab:hover{background:var(--teall)}.tab.on{background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;box-shadow:0 4px 0 var(--blued)}.subbar{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}.subtab{border:2px solid var(--teall);background:#fff;color:var(--teald);font-family:'Baloo 2';font-weight:700;font-size:13.5px;padding:6px 12px;border-radius:11px;cursor:pointer}.subtab:hover{background:var(--sky)}.subtab.on{background:var(--yellow);border-color:var(--yellowd);color:#5a3b00;box-shadow:0 3px 0 var(--yellowd)}.section-head{display:flex;align-items:center;gap:10px;margin:8px 0}.section-head h3{margin:0;font-size:24px;color:var(--blued)}
#content{padding-bottom:60px}.card,.exercise{background:#fff;border:2px solid var(--sky);border-radius:var(--r);padding:16px 18px;margin:14px 0;box-shadow:var(--sh)}.exercise{border-color:var(--bluel)}.ex-head{display:flex;gap:9px;align-items:flex-start;margin-bottom:8px}.ex-head h4{margin:0;color:var(--blued);font-size:18px}.exno{flex:0 0 28px;height:28px;border-radius:9px;background:var(--teal);color:#fff;display:grid;place-items:center;box-shadow:0 3px 0 var(--teald)}.textline,.long-passage{font-size:14.5px;margin:8px 0}.long-passage{line-height:1.75}.source-note{background:#f6fbfd;color:var(--muted);border-left:4px solid var(--bluel);padding:8px 10px;border-radius:8px;font-size:12.5px;margin:8px 0}.mini-card{background:var(--sky);border:1px solid var(--teall);border-radius:12px;padding:10px 12px;margin:7px 0}.chiprow{display:flex;gap:7px;flex-wrap:wrap}.chip{background:var(--yellowl);border:2px solid var(--yellow);border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px}.fig{margin:10px auto;max-width:700px;background:#fff;border:2px solid var(--sky);border-radius:14px;padding:8px}.fig img{max-width:100%;height:auto;display:block;margin:auto;border-radius:9px}.fig figcaption{text-align:center;font-size:11.5px;color:var(--muted);margin-top:5px}
.tablewrap{overflow:auto;margin:10px 0}.clean-table{width:100%;border-collapse:collapse;font-size:13.5px}.clean-table th{background:var(--blue);color:#fff;text-align:left;padding:9px}.clean-table td{border-bottom:1px solid var(--sky);padding:8px;vertical-align:top}.clean-table tr:nth-child(even) td{background:#fafefe}.gap{border:2px solid var(--teall);background:#f9fefe;color:var(--blued);border-radius:9px;padding:5px 8px;min-width:110px;max-width:100%;outline:none}.gap.short{width:110px}.gap.medium{width:180px}.gap.long{width:260px}.gap:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teall)}.gap.ok,.choice.ok{border-color:var(--ok);background:#ebfaf1}.gap.no,.choice.no{border-color:var(--no);background:#fdeded}.tickbox{accent-color:var(--teal);width:17px;height:17px;vertical-align:middle}.qline{border:1px dashed #dbe9ed;border-radius:11px;padding:9px 11px;margin:7px 0}.choices{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.choice{display:flex;align-items:center;gap:5px;border:2px solid var(--sky);background:#fff;border-radius:10px;padding:5px 9px;cursor:pointer}.choice:hover{background:var(--sky)}.choice input{accent-color:var(--teal)}
.writingbox{margin:10px 0}.longanswer{width:100%;resize:vertical;border:2px solid var(--teall);border-radius:12px;padding:10px 12px;outline:none;min-height:110px}.wordcount{text-align:right;font-size:11px;color:var(--muted);font-weight:700}.btnrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}.b{border:0;border-radius:11px;padding:7px 13px;font-family:'Baloo 2';font-weight:700;cursor:pointer}.b.check{background:var(--teal);color:#fff;box-shadow:0 3px 0 var(--teald)}.b.answer{background:var(--yellow);color:#5a3b00;box-shadow:0 3px 0 var(--yellowd)}.b.reset{background:#fff;border:2px solid var(--sky);color:var(--muted)}.score{font-family:'Baloo 2';font-weight:700;font-size:13px;color:var(--teald)}.ansbox{margin-top:11px;background:#f2fbf6;border-left:5px solid var(--ok);border-radius:10px;padding:10px 12px;font-size:13.5px}.ansbox:before{content:'✓ Answer & explanation';display:block;font-family:'Baloo 2';font-weight:800;color:var(--ok);margin-bottom:4px}.exercise.done{border-color:#bfe7d3}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.matchcol{display:flex;flex-direction:column;gap:7px}.mhead{text-transform:uppercase;letter-spacing:1px;font-size:11px;color:var(--muted);font-weight:800}.mitem{display:flex;gap:7px;align-items:flex-start;border:2px solid var(--sky);background:#fff;border-radius:11px;padding:8px 10px;text-align:left;cursor:pointer}.mitem:hover{border-color:var(--teal);background:var(--sky)}.mitem.sel{border-color:var(--yellowd);background:var(--yellowl)}.mitem.ok{border-color:var(--ok);background:#f1fbf5}.mitem.no{border-color:var(--no);background:#fdf2f2}.mitem .tag{flex:0 0 24px;height:24px;border-radius:7px;background:var(--sky);display:grid;place-items:center;font-weight:800}.hint{color:var(--muted);font-size:12.5px;font-style:italic}.sortable{padding:0;list-style:none}.sortable li{display:flex;gap:9px;align-items:center;border:2px solid var(--sky);border-radius:11px;padding:8px 10px;margin:6px 0;background:#fff}.drag{cursor:grab;color:var(--muted)}.move{margin-left:auto;display:flex;gap:4px}.move button{border:1px solid var(--teall);background:var(--sky);border-radius:7px;cursor:pointer}.recorder{display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:#f5fbfc;border:1px solid var(--teall);border-radius:12px;padding:10px;margin:10px 0}.record-btn{border:0;background:var(--blue);color:#fff;border-radius:10px;padding:7px 12px;font-weight:800;cursor:pointer}.record-time{font-weight:800;color:var(--teald)}.record-note{font-size:11px;color:var(--muted)}.extlink{color:var(--blue);font-weight:800;word-break:break-word}
.loading{padding:60px 15px;text-align:center;color:var(--muted);font-family:'Baloo 2';font-size:18px}.footer{background:var(--blued);color:#cee8f7;text-align:center;padding:19px;font-size:12px}.footer b{color:var(--yellow)}.home-list{display:grid;gap:8px}.homecheck{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--sky);border-radius:12px;padding:10px 12px;background:#fcfefe;cursor:pointer}.homecheck:hover{border-color:var(--teal);background:var(--sky)}.homecheck input{width:18px;height:18px;accent-color:var(--teal);margin-top:2px}.homecheck:has(input:checked){border-color:#bfe7d3;background:#f1fbf5}.homecheck:has(input:checked) span{text-decoration:line-through;color:var(--muted)}
@media(max-width:760px){.pills{display:none}.mascot{width:58px;height:58px;font-size:34px}.hero{align-items:flex-start}.progress{display:none}.matchgrid{grid-template-columns:1fr}.section-head h3{font-size:20px}.card,.exercise{padding:13px}.gap.long,.gap.medium{width:100%}}
</style></head><body>
