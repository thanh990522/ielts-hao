name: Deploy GitHub Pages

on:
  push:
    branches: [main, static-v8-final]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble Interactive v9
        run: |
          mkdir -p generated
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, re

          expected_sha={
              1:'56450782b70a6bc27cc8571c46dc391ceb7895d4446465811fc36aa1614381ec',
              2:'e34d8fa9c0b7122c4b1b4e4465e4a39435a7d597c25d3bd8d0a6dc8aa36fa4cc',
              3:'8a3dc83f947674b635a5fe5c8ae9370115b33a5f181483652500b7eac090eefc',
              4:'935bcbc00bca84c6d38a4363cf156ecef59ba372762f1309a46e68be4f67dfa1',
              5:'45e2205d8dcb4a1f6b4c44fc01953a69f8503e463dcee7454d54290e43ba8512',
              6:'e51663941d4f71046182e06f7c26eb3778999e9e9d3972f727328878c4cd593b',
          }
          for n in range(1,7):
              if n in (1,3,4):
                  files=sorted(Path('static-v9-fix').glob(f'l{n}-*.b64'))
                  if not files:
                      raise SystemExit(f'Lesson {n}: repair chunks missing')
                  text=''.join(p.read_text(encoding='utf-8-sig') for p in files)
              else:
                  text=Path(f'static-v9/lesson-{n}.js.gz.b64').read_text(encoding='utf-8-sig')
              clean=re.sub(r'\s+','',text)
              sha=hashlib.sha256(clean.encode()).hexdigest()
              if sha != expected_sha[n]:
                  raise SystemExit(f'Lesson {n}: SHA mismatch {sha}')
              raw=base64.b64decode(clean,validate=True)
              js=gzip.decompress(raw)
              Path(f'generated/lesson-{n}.js').write_bytes(js)
              print(f'Lesson {n}: SHA/base64/gzip OK · {len(js)} bytes')
          PY
          for n in 1 2 3 4 5 6; do
            test -s "generated/lesson-$n.js"
            node --check "generated/lesson-$n.js"
          done
          cp index-v9.html index.html
          node --check interactive-v9.js

      - name: Validate lesson structure
        run: |
          python - <<'PY'
          from pathlib import Path
          expected={1:21,2:22,3:21,4:20,5:21,6:21}
          for n,count in expected.items():
              s=Path(f'generated/lesson-{n}.js').read_text(encoding='utf-8')
              got=s.count('class=\\"exercise\\"')
              if got != count:
                  raise SystemExit(f'Lesson {n}: expected {count} exercises, found {got}')
              if f'window.IELTS_PRECOMPILED[{n}]' not in s:
                  raise SystemExit(f'Lesson {n}: precompiled object missing')
              if 'major' not in s or 'subtabs' not in s:
                  raise SystemExit(f'Lesson {n}: tab/subtab structure missing')
              print(f'Lesson {n}: {got} interactive exercises + tab/subtab structure OK')
          idx=Path('index.html').read_text(encoding='utf-8')
          for bad in ('exact-v2','exact-v3','packed-v8.js','app-v8.js','interactive-v3.js'):
              if bad in idx:
                  raise SystemExit(f'Old runtime reference still present: {bad}')
          for good in ('Interactive v9','interactive-v9.js','generated/lesson-1.js','generated/lesson-6.js'):
              if good not in idx:
                  raise SystemExit(f'Missing v9 reference: {good}')
          print('Interactive v9 structure validation passed')
          PY

      - name: Upload validated site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
