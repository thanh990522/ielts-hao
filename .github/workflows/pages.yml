name: Deploy GitHub Pages

on:
  push:
    branches: [main, static-v8-final]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose static v9 payloads
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          for n in range(1,7):
              p=Path(f'static-v9/lesson-{n}.js.gz.b64')
              s=p.read_text(encoding='utf-8-sig')
              clean=re.sub(r'\s+','',s)
              bad=sorted(set(clean)-set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='))
              print(f'lesson {n}: chars={len(s)} clean={len(clean)} mod4={len(clean)%4} bad={bad[:20]}')
              try:
                  raw=base64.b64decode(clean,validate=True)
                  print(f'lesson {n}: base64 OK bytes={len(raw)}')
                  doc=gzip.decompress(raw)
                  print(f'lesson {n}: gzip OK jsbytes={len(doc)}')
              except Exception as e:
                  print(f'lesson {n}: FAIL {type(e).__name__}: {e}')
          PY

      - name: Assemble Interactive v9
        run: |
          mkdir -p generated
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          for n in range(1,7):
              s=Path(f'static-v9/lesson-{n}.js.gz.b64').read_text(encoding='utf-8-sig')
              clean=re.sub(r'\s+','',s)
              raw=base64.b64decode(clean,validate=True)
              Path(f'generated/lesson-{n}.js').write_bytes(gzip.decompress(raw))
          PY
          for n in 1 2 3 4 5 6; do
            test -s "generated/lesson-$n.js"
            node --check "generated/lesson-$n.js"
          done
          cp index-v9.html index.html
          node --check interactive-v9.js

      - name: Validate lesson structure
        run: |
          python - <<'PY'
          from pathlib import Path
          expected={1:21,2:22,3:21,4:20,5:21,6:21}
          for n,count in expected.items():
              s=Path(f'generated/lesson-{n}.js').read_text(encoding='utf-8')
              got=s.count('class=\\"exercise\\"')
              if got != count:
                  raise SystemExit(f'Lesson {n}: expected {count} exercises, found {got}')
              if f'window.IELTS_PRECOMPILED[{n}]' not in s:
                  raise SystemExit(f'Lesson {n}: precompiled object missing')
              print(f'Lesson {n}: {got} interactive exercises OK')
          idx=Path('index.html').read_text(encoding='utf-8')
          for bad in ('exact-v2','exact-v3','packed-v8.js','app-v8.js','interactive-v3.js'):
              if bad in idx:
                  raise SystemExit(f'Old runtime reference still present: {bad}')
          for good in ('Interactive v9','interactive-v9.js','generated/lesson-1.js','generated/lesson-6.js'):
              if good not in idx:
                  raise SystemExit(f'Missing v9 reference: {good}')
          print('Interactive v9 structure validation passed')
          PY

      - name: Upload validated site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
