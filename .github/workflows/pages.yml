name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Diagnose packed Lesson 1
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('exact-v3/l1.js').read_text(encoding='utf-8-sig')
          print('chars=',len(s))
          print('head=',repr(s[:120]))
          print('tail=',repr(s[-120:]))
          print('single_quotes=',s.count("'"),'double_quotes=',s.count('"'))
          vals=re.findall(r"'([^']*)'",s)
          print('quoted_count=',len(vals),'lengths=',[len(x) for x in vals])
          allowed=set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          for i,q in enumerate(vals):
              bad=sorted(set(q)-allowed)
              print('quoted',i,'len',len(q),'bad_sample',repr(bad[:20]),'head',repr(q[:30]))
          PY

      - name: Prebuild interactive lessons
        run: |
          python -m pip install --quiet beautifulsoup4
          python scripts/build_precompiled.py
          test -f generated/lesson-1.js
          test -f generated/lesson-6.js
          grep -q 'Interactive v7' index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
