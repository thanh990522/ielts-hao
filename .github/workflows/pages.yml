name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate complete packed Lesson 1
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,base64,gzip
          fs=sorted(Path('packed').glob('l1-*.js'))
          print('files=',[p.name for p in fs])
          parts=[]
          for p in fs:
              s=p.read_text(encoding='utf-8-sig')
              vals=re.findall(r"'([^']*)'",s)
              print(p.name,'chars=',len(s),'quotes=',s.count("'"),'quoted_lengths=',[len(x) for x in vals])
              vals=[re.sub(r'\s+','',x) for x in vals if len(re.sub(r'\s+','',x))>100]
              if not vals: raise SystemExit(f'No payload in {p}')
              parts.append(vals[-1])
          b=''.join(parts)
          raw=base64.b64decode(b)
          doc=gzip.decompress(raw).decode('utf-8')
          print('packed_chars=',len(b),'html_chars=',len(doc),'has_body=',('<body' in doc.lower()),'tasks=',doc.count('TASK '))
          PY

      - name: Prebuild interactive lessons
        run: |
          python -m pip install --quiet beautifulsoup4
          sed -i "s#fs=\[Path('exact-v3/l1.js')\] if n==1 else sorted(Path('exact-v2').glob(f'l{n}-\*.js'))#fs=sorted(Path('packed').glob(f'l{n}-*.js')) if n==1 else sorted(Path('exact-v2').glob(f'l{n}-*.js'))#" scripts/build_precompiled.py
          python scripts/build_precompiled.py
          test -f generated/lesson-1.js
          test -f generated/lesson-6.js
          grep -q 'Interactive v7' index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
